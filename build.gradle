plugins {
    id "java"
    id "maven-publish"
    id "io.freefair.lombok" version "9.2.0"
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id "com.github.ben-manes.versions" version "0.53.0"
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

configurations {
    mockitoAgent
}

dependencies {
    implementation "org.springframework.boot:spring-boot-properties-migrator"

    implementation "org.springframework.boot:spring-boot-configuration-processor"
    implementation "org.springframework.boot:spring-boot-starter-data-mongodb-reactive"
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-security"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    implementation 'org.springframework.boot:spring-boot-starter-undertow'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation "com.microsoft.azure:applicationinsights-runtime-attach:3.7.8"

    implementation 'com.google.guava:guava:33.8.0-android'

    implementation "org.mapstruct:mapstruct:1.6.3"
    annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"

    developmentOnly "org.springframework.boot:spring-boot-devtools"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "io.projectreactor:reactor-test"
    mockitoAgent("org.mockito:mockito-core") { transitive = false }

    testImplementation "de.flapdoodle.embed:de.flapdoodle.embed.mongo:4.22.0"
    testImplementation "de.flapdoodle.embed:de.flapdoodle.embed.mongo.spring30x:4.22.0"

    testImplementation 'org.springframework.graphql:spring-graphql-test'

}

group = "pl.maciejkopec"
version = "1.0.0-SNAPSHOT"
description = "cms"

tasks.withType(JavaCompile) {
    options.compilerArgs += "-Amapstruct.defaultComponentModel=spring"
    options.compilerArgs += "--enable-preview"
    options.encoding = "UTF-8"

}

tasks.withType(Test) {
    jvmArgs += "--enable-preview"
    jvmArgumentProviders.add(new MockitoAgentArgumentProvider(configurations.mockitoAgent))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
    }
}

bootBuildImage {
    builder = "micneo/cms"
}

jar {
    enabled = false
}

compileJava.inputs.files(processResources)

class MockitoAgentArgumentProvider implements CommandLineArgumentProvider {
    @Classpath
    final FileCollection agent

    MockitoAgentArgumentProvider(FileCollection agent) {
        this.agent = agent
    }

    @Override
    Iterable<String> asArguments() {
        ["-javaagent:${agent.singleFile}"]
    }
}
